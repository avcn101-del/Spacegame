<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rocinante</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="tactical"></canvas>
<div id="game">
  <canvas id="closeup"></canvas>
  <header>
    <div class="num"><span class="l" id="l-clock"></span><span class="v" id="n-clock">0:00</span></div>
    <div class="num"><span class="l" id="l-range"></span><span class="v"><span id="n-range">0.0</span><span id="n-rate"></span></span></div>
    <div id="title"></div>
    <div id="phase"></div>
    <button id="view"></button>
    <button id="pause"></button>
    <button id="help"></button>
  </header>
  <section class="panel me" id="panel-me">
    <div class="name" id="name-me"></div>
    <canvas id="sil-me"></canvas>
    <div class="nums">
      <div class="num"><span class="l" id="l-torps"></span><span class="v" id="n-torps">0</span></div>
      <div class="num"><span class="l" id="l-burns"></span><span class="v" id="n-burns">0</span></div>
    </div>
  </section>
  <section class="panel them" id="panel-them">
    <div class="name" id="name-them"></div>
    <canvas id="sil-them"></canvas>
  </section>
  <div id="toasts"></div>
  <div id="status">
    <div id="alerts"><span id="alert-main"></span><span id="alert-sub"></span></div>
    <div id="status-row"><div id="order"></div><div id="inspector"></div></div>
  </div>
  <nav id="orders">
    <div class="group">
      <button id="btn-hold"><span class="label"></span><span class="hint"></span><span class="sub"></span></button>
    </div>
    <div class="group">
      <button id="btn-guard"><span class="label"></span><span class="hint"></span><span class="sub"></span></button>
      <button id="btn-rake"><span class="label"></span><span class="hint"></span><span class="sub"></span></button>
    </div>
    <div class="group">
      <button id="btn-torps" class="progress"><span class="label"></span><span class="hint"></span><span class="sub"></span></button>
      <button id="btn-rail" class="progress"><span class="label"></span><span class="hint"></span><span class="sub"></span></button>
      <button id="btn-burn"><span class="label"></span><span class="hint"></span><span class="sub"></span></button>
    </div>
    <div class="group">
      <button id="btn-run" class="danger"><span class="label"></span><span class="hint"></span><span class="sub"></span></button>
    </div>
  </nav>
  <div id="pausemenu" class="overlay">
    <div class="box">
      <div class="h" id="pm-title"></div>
      <ul id="legend"></ul>
      <div class="row"><button id="pm-resume"></button><button id="pm-restart"></button><button id="pm-new"></button><button id="pm-close"></button></div>
      <div class="row small"><button id="pm-export"></button><button id="pm-import"></button><button id="pm-auto"></button><button id="pm-hangar"></button></div>
    </div>
  </div>
  <div id="result" class="overlay">
    <div class="box">
      <div id="result-text"></div>
      <div id="result-seed"></div>
      <table id="stats"></table>
      <div class="row"><button id="again"></button><button id="same"></button></div>
      <div class="row small"><button id="rs-export"></button><button id="rs-import"></button><button id="rs-hangar"></button></div>
    </div>
  </div>
  <div id="hangar" class="overlay">
    <div class="box">
      <div class="h" id="hg-title"></div>
      <canvas id="hg-canvas"></canvas>
      <div id="hg-arcs"></div>
      <div id="hg-list"></div>
      <div id="hg-line"></div>
      <div class="row"><button id="hg-enemy"></button><button id="hg-launch"></button><button id="hg-close"></button></div>
    </div>
  </div>
  <div id="exportbox" class="overlay">
    <div class="box">
      <div class="h" id="export-title"></div>
      <textarea id="export-text" readonly></textarea>
      <div class="row"><button id="export-copy"></button><button id="export-download"></button><button id="export-close"></button></div>
    </div>
  </div>
  <div id="rotate"><div id="rotate-text"></div></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
